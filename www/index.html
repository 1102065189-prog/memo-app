<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Memo AI备忘录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
              <rect x="9" y="3" width="6" height="4" rx="1"/>
              <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          </div>
          <h1>Memo</h1>
        </div>
        <div class="header-actions">
          <button id="btn-ai-recommend" class="icon-btn ai-btn" title="AI 推荐">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </button>
          <button id="btn-ai-chat" class="icon-btn ai-btn" title="AI 对话">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </button>
          <button id="btn-stats" class="icon-btn" title="统计">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
          </button>
          <button id="btn-settings" class="icon-btn" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </button>
          <button id="btn-add" class="icon-btn primary" title="添加">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
      <!-- Quick Input -->
      <div class="quick-input">
        <input type="text" id="input-memo" placeholder="输入任务，或用 /ai 与AI对话..." autocomplete="off">
        <button id="btn-submit" class="btn-send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="ai-parse-bar">
        <label class="ai-parse-toggle">
          <input type="checkbox" id="toggle-ai-parse">
          <span class="ai-parse-slider"></span>
        </label>
        <span class="ai-parse-label">AI 解析</span>
      </div>
    </header>

    <!-- Filter Tabs -->
    <div class="filter-bar">
      <button class="filter-tab active" data-filter="pending">待办</button>
      <button class="filter-tab" data-filter="today">今天</button>
      <button class="filter-tab" data-filter="overdue">逾期</button>
      <button class="filter-tab" data-filter="completed">已完成</button>
      <button class="filter-tab" data-filter="all">全部</button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <input type="text" id="input-search" placeholder="搜索备忘录...">
    </div>

    <!-- Memo List -->
    <div id="memo-list" class="memo-list"></div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
      <p>暂无备忘录</p>
      <p class="sub">在上方输入框中输入自然语言添加</p>
      <p class="sub hint">提示：输入 <code>/ai 你的问题</code> 可与 AI 对话</p>
    </div>

    <!-- Stats Modal -->
    <div id="modal-stats" class="modal" style="display:none">
      <div class="modal-content">
        <div class="modal-header">
          <h2>统计概览</h2>
          <button class="modal-close">&times;</button>
        </div>
        <div id="stats-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="modal-edit" class="modal" style="display:none">
      <div class="modal-content">
        <div class="modal-header">
          <h2>编辑备忘录</h2>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label>描述</label>
            <input type="text" id="edit-desc">
          </div>
          <div class="form-group">
            <label>分类</label>
            <select id="edit-category">
              <option value="工作">工作</option>
              <option value="生活">生活</option>
              <option value="项目">项目</option>
              <option value="购物">购物</option>
              <option value="健康">健康</option>
              <option value="学习">学习</option>
              <option value="财务">财务</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>优先级</label>
            <select id="edit-priority">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="form-group">
            <label>日期时间</label>
            <input type="datetime-local" id="edit-datetime">
          </div>
          <div class="form-group">
            <label>相关人员</label>
            <input type="text" id="edit-people" placeholder="用逗号分隔">
          </div>
          <div class="form-actions">
            <button id="btn-edit-save" class="btn btn-primary">保存</button>
            <button id="btn-edit-cancel" class="btn">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/settings.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/time-parser.js"></script>
  <script src="js/nl-parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>

  <!-- Weiyu 标识 -->
  <div class="weiyu-brand">
    <span class="weiyu-text">Weiyu</span>
  </div>
</body>
</html>
